services:
  - type: web
    name: mno-bot
    env: python
    region: oregon

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: gunicorn app:app \
      --bind 0.0.0.0:$PORT \
      --workers 3 \
      --threads 2 \
      --timeout 120 \
      --log-level info

    autoDeploy: true

    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: FLASK_ENV
        value: production
      - key: TZ
        value: "Asia/Riyadh"

    healthCheckPath: /health
    healthCheckTimeout: 10
